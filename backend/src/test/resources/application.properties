# Test-time overrides: run against in-memory H2 so Spring context load does not
# depend on a reachable PostgreSQL instance or production DB_* variables.
spring.datasource.url=jdbc:h2:mem:wams_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

# Deterministic JWT secret for tests (not for production)
app.jwt.secret=wams-test-signing-key-with-at-least-32-bytes-2026-xxxxx
app.jwt.expiration-ms=3600000
app.jwt.issuer=wams-backend-test
app.cors.allowed-origins=http://localhost:5173
