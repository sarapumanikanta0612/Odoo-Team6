spring.application.name=wams-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/wams_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Pin the ORM's JDBC session timezone to the canonical IANA zone for India.
# Keeps timestamp conversions deterministic even if a JVM is launched with a
# different default. Also compatible with PostgreSQL 17 (which rejects the
# deprecated 'Asia/Calcutta' alias that Windows Java sometimes reports).
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata

# Server Configuration
server.port=8080

# JSON serialization
# Note: in Spring Boot 4.x (Jackson 3, package `tools.jackson.*`), the property
# `spring.jackson.serialization.write-dates-as-timestamps` currently fails to bind
# because the kebab-case key is not relaxed-converted to the Jackson 3 enum constant
# WRITE_DATES_AS_TIMESTAMPS. The default behavior (ISO-8601 strings, not epoch
# numbers) is already what we want thanks to the auto-registered JSR310 module,
# so no property is required. If an override is ever needed, register a
# `JacksonObjectMapperBuilderCustomizer` bean in Java instead of using properties.

# JWT Configuration
# IMPORTANT: Override JWT_SECRET in production. Must be >= 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-change-me-at-least-32-bytes-long-xxxxxxxxxxxxxxxxxxxx}
app.jwt.expiration-ms=86400000
app.jwt.issuer=wams-backend

# CORS: comma-separated origins for the React dev server
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Initial admin bootstrap: creates the first ADMIN on startup IF no admin exists
# AND both env vars below are set. Missing/blank values => bootstrap is skipped
# with a warning. Public registration continues to only create PRIMARY_CLIENT.
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
app.bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_NAME:Administrator}

# Error response: do not expose stack traces
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
