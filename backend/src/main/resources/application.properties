spring.application.name=wams-backend

# PostgreSQL Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/wams_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# JSON serialization
spring.jackson.serialization.write-dates-as-timestamps=false

# JWT Configuration
# IMPORTANT: Override JWT_SECRET in production. Must be >= 32 bytes for HS256.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-change-me-at-least-32-bytes-long-xxxxxxxxxxxxxxxxxxxx}
app.jwt.expiration-ms=86400000
app.jwt.issuer=wams-backend

# CORS: comma-separated origins for the React dev server
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# Error response: do not expose stack traces
server.error.include-stacktrace=never
server.error.include-message=always
server.error.include-binding-errors=always
